<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bouvi'Burger</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e2372b">
<meta name="description" content="Bouvi'Burger : le fast-food en 3D à la première personne. Prenez les commandes, cuisinez, servez !">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bouvi'Burger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div id="loading"><div>Ouverture du restaurant…</div><div class="bar"><i id="loadbar"></i></div></div>
    <div class="lookzone" id="look" hidden></div>
    <div class="cross" id="cross"></div>
    <div id="prompt"></div>
    <div class="top">
      <div class="tickets" id="tickets"></div>
      <div class="chips">
        <div class="chip money" id="money">0,00 €</div>
        <div class="chip" id="timer">6:00</div>
        <div class="chip small" id="lvl"><span>Jour 1 · Niv. 1</span><span class="xp"><i></i></span></div>
        <span id="deliv" hidden></span>
        <span class="net" id="net" hidden></span>
      </div>
    </div>
    <div id="toast"></div>
    <div id="held">Mains vides</div>
    <div id="lockHint" hidden></div>
    <button id="gear" aria-label="Réglages" hidden>⚙</button>
    <div class="pads" id="pads" hidden>
      <div class="joy" id="joy"><i></i></div>
      <button class="act" id="act">Action</button>
    </div>
  </div>
</div>
<div id="overlay" hidden></div>
<noscript>Bouvi'Burger a besoin de JavaScript.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
