<title>Bouvi'Burger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: plein écran à la première personne — viseur au centre, tickets à gauche, caisse en haut à droite, objet en main en bas */
:root{
  --bg:#0e1516; --paper:#fffaf0; --ink:#182221;
  --red:#e2372b; --teal:#18a58f; --gold:#ffc72c;
  --ok:#3fb35f; --warn:#f2a51c; --bad:#e2372b;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{position:relative;flex:1;min-height:300px;border-radius:14px;overflow:hidden;background:#000}
.stage canvas{display:block;touch-action:none;cursor:crosshair}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:16px}

.cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid rgba(255,255,255,.85);pointer-events:none;transition:transform .1s,background .1s}
.cross.on{background:var(--gold);border-color:#fff;transform:scale(1.5)}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);background:rgba(10,14,14,.78);padding:5px 12px;border-radius:8px;font-weight:600;font-size:14px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .12s}
#prompt.on{opacity:1}
#prompt b{color:var(--gold)}

.top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.tickets{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden;flex-wrap:wrap;max-height:180px}
.ticket{background:var(--paper);color:var(--ink);border-radius:4px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:4px;min-width:110px;
  box-shadow:0 4px 12px rgba(0,0,0,.45);animation:drop .4s cubic-bezier(.3,1.5,.5,1);border-top:6px solid var(--red)}
@keyframes drop{from{transform:translateY(-24px);opacity:0}}
.ticket .tn{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-size:11px}
.ticket .tn span:first-child{color:var(--red)}
.ticket .icons{display:flex;gap:1px;flex-wrap:wrap;max-width:170px}
.ticket .icons img{width:24px;height:24px}
.ticket .pat{height:5px;border-radius:3px;background:#e5e0d4;overflow:hidden}
.ticket .pat i{display:block;height:100%}
.ticket.hurry{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{background:rgba(10,14,14,.8);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:3px 12px;font-family:var(--display);font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums}
.chip.money{color:var(--gold)}
#timer.low{color:var(--bad)}
.net{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.55)}
.net.on{background:var(--teal)}

#held{position:absolute;right:12px;bottom:12px;background:rgba(10,14,14,.78);padding:6px 12px;border-radius:8px;font-size:13px;pointer-events:none}
#held b{color:var(--gold)}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);background:rgba(10,14,14,.88);color:#fff;padding:8px 16px;border-radius:20px;
  font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.pop{position:absolute;left:50%;top:40%;font-family:var(--display);font-size:34px;color:var(--gold);-webkit-text-stroke:2px var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{transform:translate(-50%,-20%) scale(.5)}20%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-200%);opacity:0}}
#lockHint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(10,14,14,.7);padding:5px 12px;border-radius:20px;font-size:12px;pointer-events:none;white-space:nowrap}

.pads{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:2}
.pads>*{pointer-events:auto}
.joy{width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.35);position:relative;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85)}
.act{width:86px;height:86px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;font-weight:800;font-size:14px;box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;margin-bottom:34px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.lookzone{position:absolute;right:0;top:0;bottom:0;width:55%;touch-action:none;z-index:1}

#overlay{position:fixed;inset:0;background:rgba(8,12,12,.82);display:grid;place-items:center;z-index:30;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);border-top:8px solid var(--red)}
.card h1{font-family:var(--display);font-size:38px;line-height:.95;margin:0;color:var(--red);text-wrap:balance}
.card h2{font-family:var(--display);font-size:24px;margin:0;color:var(--teal)}
.card p{margin:0;line-height:1.45}
.card ol{margin:0;padding-left:20px;line-height:1.5;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.a{background:var(--teal)}.btn.b{background:var(--red)}.btn.c{background:#5d6b69}
.code{font-family:var(--display);font-size:44px;letter-spacing:8px;text-align:center;color:var(--red);background:#efe8d8;border-radius:10px;padding:8px}
#codeIn{font-family:var(--display);font-size:28px;letter-spacing:8px;text-align:center;text-transform:uppercase;border:2px solid var(--ink);border-radius:10px;padding:8px;width:100%;background:#fff;color:var(--ink)}
.stars{font-size:44px;letter-spacing:6px;color:var(--gold);text-align:center}
.stars .off{color:#d8d2c4}
.recap{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.recap b{text-align:right}
.ctl{font-size:13px;background:#efe8d8;border-radius:8px;padding:8px 10px;line-height:1.5}
.note{font-size:13px;color:#5d6b69}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.joy{width:104px;height:104px}.act{width:76px;height:76px}.chip{font-size:16px}.ticket .icons img{width:20px;height:20px}.tickets{max-height:120px}}
</style>

<div id="app">
  <div class="stage" id="stage">
    <div id="loading">Ouverture du restaurant…</div>
    <div class="lookzone" id="look" hidden></div>
    <div class="cross" id="cross"></div>
    <div id="prompt"></div>
    <div class="top">
      <div class="tickets" id="tickets"></div>
      <div class="chips">
        <div class="chip money" id="money">0,00 €</div>
        <div class="chip" id="timer">6:00</div>
        <span class="net" id="net" hidden></span>
      </div>
    </div>
    <div id="toast"></div>
    <div id="held">Mains vides</div>
    <div id="lockHint" hidden></div>
    <div class="pads" id="pads" hidden>
      <div class="joy" id="joy"><i></i></div>
      <button class="act" id="act">Action</button>
    </div>
  </div>
</div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== DONNÉES DU JEU ===================== */
const RECIPES=[
  {n:'Le Classique',f:['patty','lettuce','tomato','ketchup'],p:6.5},
  {n:'Le Cheese',f:['patty','cheese','ketchup','mustard'],p:6.9},
  {n:"Le Ch'ti",f:['patty','cheese','onion','mustard'],p:7.5},
  {n:'Le Bouvines',f:['patty','lettuce','tomato','onion','mayo'],p:7.9},
  {n:'Le Double',f:['patty','patty','cheese','cheese','ketchup'],p:8.9},
];
const NAMES={bun:'Pain',raw:'Steak cru',patty:'Steak cuit',burnt:'Steak brûlé',lettuce:'Salade',tomato:'Tomate',cheese:'Cheddar',onion:'Oignons',
  ketchup:'Ketchup',mayo:'Mayo',mustard:'Moutarde',frozen:'Frites surgelées',fries:'Frites',charred:'Frites brûlées',cup:'Gobelet vide',soda:'Soda',burger:'Burger',sauce:'Sauce'};
const FILL=['patty','lettuce','tomato','cheese','onion'];
const GRILL_T1=10,GRILL_T2=32,FRY_T1=9,FRY_T2=34,SODA_T=3;
const DAY=360,PRICE_FRIES=2.5,PRICE_SODA=2;
const DOOR={x:2.5,z:7.3},REG={x:-2.6,z:2.5},PICK={x:1.0,z:2.5};
const WAITS=[{x:1.0,z:3.4},{x:2.0,z:3.8},{x:3.0,z:3.4},{x:3.9,z:3.9},{x:1.6,z:4.6}];
const SPAWN=[{x:-0.8,z:-0.6},{x:0.8,z:-0.6}];
const euro=v=>v.toFixed(2).replace('.',',')+' €';

/* ===================== ICÔNES 2D ===================== */
function circ(c,x,y,r,f,s,lw){c.beginPath();c.arc(x,y,r,0,7);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}}
function drawIcon(c,t,x,y,s){c.save();c.translate(x,y);c.scale(s/26,s/26);c.lineWidth=2.5;c.strokeStyle='rgba(0,0,0,.55)';
  const bottle=(col)=>{c.fillStyle=col;c.beginPath();c.moveTo(-8,-6);c.lineTo(8,-6);c.lineTo(9,18);c.lineTo(-9,18);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(-5,-6);c.lineTo(0,-20);c.lineTo(5,-6);c.closePath();c.fillStyle='#f4f4f4';c.fill();c.stroke()};
  switch(t){
  case'bun':c.fillStyle='#e7a24c';c.beginPath();c.ellipse(0,2,20,15,0,Math.PI,0);c.fill();c.stroke();c.fillRect(-20,2,40,7);c.strokeRect(-20,2,40,7);
    c.fillStyle='#fff6dc';[[-9,-5],[0,-9],[8,-4],[-3,-1]].forEach(([a,b])=>{c.beginPath();c.ellipse(a,b,1.8,3,a,0,7);c.fill()});break;
  case'patty':circ(c,0,0,18,'#6a3a1f','rgba(0,0,0,.55)',2.5);c.strokeStyle='#3a1a0a';c.lineWidth=3;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(-11,i*7-3);c.lineTo(11,i*7+3);c.stroke()}break;
  case'cheese':c.rotate(.25);c.fillStyle='#ffb52e';c.fillRect(-15,-15,30,30);c.strokeRect(-15,-15,30,30);break;
  case'lettuce':c.fillStyle='#6cc24a';c.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,r=i%2?14:19;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.fill();c.stroke();break;
  case'tomato':circ(c,0,0,18,'#e23a2a','rgba(0,0,0,.55)',2.5);circ(c,0,0,11,'#ff7b5c');c.fillStyle='#ffe2a0';for(let i=0;i<5;i++){const a=i/5*6.28;c.beginPath();c.ellipse(Math.cos(a)*6,Math.sin(a)*6,1.8,3,a,0,7);c.fill()}break;
  case'onion':c.lineWidth=4;c.strokeStyle='#c6a0c9';c.beginPath();c.arc(-5,0,10,0,7);c.stroke();c.beginPath();c.arc(6,2,8,0,7);c.stroke();break;
  case'ketchup':bottle('#d62a1e');break;
  case'mayo':bottle('#f6ebc2');break;
  case'mustard':bottle('#f2c21b');break;
  case'fries':c.fillStyle='#ffd23a';for(let i=0;i<5;i++){c.fillRect(-11+i*4.5,-20,4,18);c.strokeRect(-11+i*4.5,-20,4,18)}c.fillStyle='#e2372b';c.beginPath();c.moveTo(-14,-5);c.lineTo(14,-5);c.lineTo(10,18);c.lineTo(-10,18);c.closePath();c.fill();c.stroke();break;
  case'soda':c.fillStyle='#ffffff';c.beginPath();c.moveTo(-12,-12);c.lineTo(12,-12);c.lineTo(9,20);c.lineTo(-9,20);c.closePath();c.fill();c.stroke();c.fillStyle='#e2372b';c.fillRect(-11,0,22,8);
    c.fillStyle='#ddd';c.fillRect(-13,-16,26,5);c.strokeRect(-13,-16,26,5);c.strokeStyle='#e2372b';c.lineWidth=3;c.beginPath();c.moveTo(3,-16);c.lineTo(8,-25);c.stroke();break;
  }c.restore()}
const ICON={};['bun','patty','cheese','lettuce','tomato','onion','ketchup','mayo','mustard','fries','soda'].forEach(t=>{const o=document.createElement('canvas');o.width=o.height=52;drawIcon(o.getContext('2d'),t,26,26,22);ICON[t]=o.toDataURL()});

/* ===================== SONS ===================== */
let AC=null;
function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const seq={pick:[[600,.05]],drop:[[360,.06]],serve:[[523,.08],[659,.08],[784,.08],[1046,.16]],bad:[[150,.2]],bell:[[1568,.35]],order:[[880,.07],[1175,.12]],cook:[[740,.05],[990,.07]],squirt:[[220,.08]]}[k]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'sawtooth':k==='bell'?'sine':'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(k==='bell'?.18:.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}}

/* ===================== MOTEUR 3D : textures et matières ===================== */
const stage=document.getElementById('stage');
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
let renderer,scene,camera,hand,ok3d=!!window.THREE,MAXANI=4;
const INTER=[];
function reg(o,id){o.userData.id=id;INTER.push(o);return o}
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry||rx)}return t}
function speckle(g,w,h,n,cols,a){for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.globalAlpha=Math.random()*a;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}g.globalAlpha=1}
const T={};
function makeTextures(){
  T.quarry=tex(256,256,(g)=>{g.fillStyle='#4a2c22';g.fillRect(0,0,256,256);
    for(let y=0;y<2;y++)for(let x=0;x<2;x++){const v=Math.random()*20-10;g.fillStyle=`rgb(${168+v},${70+v/2},${48+v/2})`;g.fillRect(x*128+4,y*128+4,120,120);
      const gr=g.createLinearGradient(x*128,y*128,x*128+128,y*128+128);gr.addColorStop(0,'rgba(255,255,255,.08)');gr.addColorStop(1,'rgba(0,0,0,.1)');g.fillStyle=gr;g.fillRect(x*128+4,y*128+4,120,120)}
    speckle(g,256,256,1400,['#2a1510','#e8a080'],.35)},19,10);
  T.checker=tex(256,256,(g)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){g.fillStyle=(x+y)%2?'#f2efe6':'#1e2222';g.fillRect(x*128,y*128,128,128)}
    g.strokeStyle='rgba(120,120,120,.5)';g.lineWidth=2;for(let i=0;i<=2;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,256);g.moveTo(0,i*128);g.lineTo(256,i*128);g.stroke()}
    speckle(g,256,256,800,['#888','#fff'],.25)},15,7);
  T.subway=tex(256,256,(g)=>{g.fillStyle='#b9bcb8';g.fillRect(0,0,256,256);
    for(let r=0;r<4;r++)for(let k=-1;k<2;k++){const x=k*128+(r%2?64:0),y=r*64;const gr=g.createLinearGradient(0,y,0,y+64);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#e7ebe8');g.fillStyle=gr;g.fillRect(x+3,y+3,122,58)}},8,5);
  T.brushed=tex(256,256,(g)=>{g.fillStyle='#b8bec2';g.fillRect(0,0,256,256);for(let i=0;i<500;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.18)':'rgba(0,0,0,.08)';g.fillRect(Math.random()*256,Math.random()*256,40+Math.random()*120,1)}},2,2);
  T.wood=tex(256,256,(g)=>{g.fillStyle='#8a5530';g.fillRect(0,0,256,256);for(let i=0;i<60;i++){g.strokeStyle=`rgba(${Math.random()<.5?'60,30,10':'190,130,80'},.35)`;g.lineWidth=1+Math.random()*3;g.beginPath();const y=Math.random()*256;g.moveTo(0,y);g.bezierCurveTo(80,y+10,170,y-10,256,y+4);g.stroke()}},2,1);
  T.redPanel=tex(512,256,(g)=>{g.fillStyle='#c4271d';g.fillRect(0,0,512,256);for(let x=0;x<512;x+=64){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,0,4,256);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x+4,0,3,256)}
    g.fillStyle='#ffc72c';g.font='bold 66px Bungee,Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText("BOUVI'BURGER",256,128)});
  T.wrap=tex(256,128,(g)=>{g.fillStyle='#f5efe2';g.fillRect(0,0,256,128);g.fillStyle='#e2372b';for(let x=0;x<256;x+=32)g.fillRect(x,0,12,128);
    g.fillStyle='#fff';g.beginPath();g.arc(128,64,34,0,7);g.fill();g.fillStyle='#e2372b';g.font='bold 30px Bungee,Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('BB',128,66)});
  T.cup=tex(256,128,(g)=>{g.fillStyle='#ffffff';g.fillRect(0,0,256,128);g.fillStyle='#e2372b';g.fillRect(0,46,256,40);g.fillStyle='#ffc72c';g.font='bold 26px Bungee,Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('BOUVI',64,67);g.fillText('BOUVI',192,67)});
  T.box=tex(128,128,(g)=>{g.fillStyle='#d8322a';g.fillRect(0,0,128,128);g.fillStyle='#ffc72c';g.font='bold 40px Bungee,Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('BB',64,70)});
  T.recipes=tex(1024,640,(g,w,h)=>{g.fillStyle='#1f2f2a';g.fillRect(0,0,w,h);g.strokeStyle='#8a5530';g.lineWidth=28;g.strokeRect(0,0,w,h);
    speckle(g,w,h,3000,['#fff'],.06);
    g.fillStyle='#ffc72c';g.font='bold 54px Bungee,Impact,sans-serif';g.textAlign='center';g.fillText('RECETTES',w/2,82);
    g.textAlign='left';RECIPES.forEach((r,i)=>{const y=150+i*96;g.fillStyle='#fffaf0';g.font='bold 38px Rubik,Arial,sans-serif';g.fillText(r.n,48,y+12);
      ['bun',...r.f,'bun'].forEach((t,j)=>drawIcon(g,t,440+j*72,y,30))});
    g.fillStyle='rgba(255,255,255,.6)';g.font='26px Rubik,Arial,sans-serif';g.fillText('Pain → garnitures → sauces → pain. Frites et soda à part sur le plateau.',48,h-34)});
  T.menu=tex(1024,640,(g,w,h)=>{g.fillStyle='#141a1a';g.fillRect(0,0,w,h);g.fillStyle='#e2372b';g.fillRect(0,0,w,110);

const msig=a=>a.slice().sort().join();
function newCustomer(){const id=++G.cid,easy=G.served<2;
  const r=easy?Math.floor(Math.random()*2):Math.floor(Math.random()*RECIPES.length);
  G.cust.push({id,st:'in',x:DOOR.x,z:DOOR.z,tx:DOOR.x,tz:DOOR.z,r,fr:Math.random()<.55?1:0,dr:Math.random()<.6?1:0,pat:0,max:1,slot:-1})}
function orderOf(c){const R=RECIPES[c.r];return{n:R.n,f:R.f,fr:c.fr,dr:c.dr,price:R.p+c.fr*PRICE_FRIES+c.dr*PRICE_SODA}}
function burgerOK(c,f){return c[0]==='bun'&&c[c.length-1]==='top'&&msig(c.slice(1,-1))===msig(f)}
function trayMatch(tr,c){const o=orderOf(c),b=tr.filter(i=>i.t==='burger'),fr=tr.filter(i=>i.t==='fries').length,dr=tr.filter(i=>i.t==='soda').length;
  return b.length===1&&burgerOK(b[0].c,o.f)&&fr===o.fr&&dr===o.dr&&tr.length===1+fr+dr}
function trayDiff(tr,c){const o=orderOf(c),out=[],b=tr.filter(i=>i.t==='burger');
  if(!b.length)out.push('il manque le burger');else if(b.length>1)out.push('un burger de trop');else if(!burgerOK(b[0].c,o.f))out.push('le burger n’est pas un « '+o.n+' »');
  const fr=tr.filter(i=>i.t==='fries').length,dr=tr.filter(i=>i.t==='soda').length;
  if(fr<o.fr)out.push('il manque les frites');if(fr>o.fr)out.push('frites en trop');if(dr<o.dr)out.push('il manque le soda');if(dr>o.dr)out.push('soda en trop');
  if(tr.some(i=>!['burger','fries','soda'].includes(i.t)))out.push('un produit n’a rien à faire là');return out}

/* --- actions (solo / hôte) --- */
function interact(i,id){
  if(!G||G.ph!=='play'||!id)return;
  const p=G.players[i],h=p.h,[kind,arg]=id.split(':');
  if(kind==='crate'){if(!h){p.h={t:arg};return feedback(i,'pick')}if(h.t===arg){p.h=null;return feedback(i,'drop')}return say(i,'Vous avez déjà les mains prises')}
  if(kind==='sauce'){if(!h){p.h={t:'sauce',k:arg};return feedback(i,'pick')}if(h.t==='sauce'){p.h=null;return feedback(i,'drop')}return say(i,'Vous avez déjà les mains prises')}
  if(kind==='board'){const n=+arg,b=G.boards[n],closed=b[b.length-1]==='top';
    if(!h){if(!b.length)return say(i,'La planche est vide');p.h={t:'burger',c:b.slice()};G.boards[n]=[];return feedback(i,'pick')}
    if(h.t==='burger'){if(b.length)return say(i,'La planche est occupée');G.boards[n]=h.c;p.h=null;return feedback(i,'drop')}
    if(h.t==='bun'){if(!b.length){b.push('bun');p.h=null;return feedback(i,'drop')}
      if(closed)return say(i,'Ce burger est déjà fermé');if(b.length<2)return say(i,'Ajoutez d’abord une garniture');b.push('top');p.h=null;return feedback(i,'cook')}
    if(FILL.includes(h.t)){if(!b.length)return say(i,'Commencez par poser un pain');if(closed)return say(i,'Ce burger est déjà fermé');if(b.length>=11)return say(i,'Le burger est trop haut');b.push(h.t);p.h=null;return feedback(i,'drop')}
    if(h.t==='sauce'){if(!b.length)return say(i,'Commencez par poser un pain');if(closed)return say(i,'Ce burger est déjà fermé');if(b.includes(h.k))return say(i,'Il y a déjà de la sauce '+NAMES[h.k].toLowerCase());b.push(h.k);return feedback(i,'squirt')}
    if(h.t==='raw')return say(i,'Ce steak est cru : passez-le sur la plancha');
    return say(i,'Ça ne va pas dans un burger')}
  if(kind==='grill'){
    if(h&&h.t==='raw'){const k=G.grill.indexOf(-1);if(k<0)return say(i,'La plancha est pleine');G.grill[k]=0;p.h=null;return feedback(i,'squirt')}
    if(!h){let k=-1,bt=-1;G.grill.forEach((c,j)=>{if(c>=GRILL_T1&&c>bt){bt=c;k=j}});
      if(k<0)return say(i,G.grill.some(c=>c>=0)?'Pas encore cuit…':'La plancha est vide');
      p.h={t:G.grill[k]>=GRILL_T2?'burnt':'patty'};G.grill[k]=-1;return feedback(i,'pick')}
    return say(i,'Posez des steaks crus sur la plancha')}
  if(kind==='fryer'){
    if(h&&h.t==='frozen'){const k=G.fry.indexOf(-1);if(k<0)return say(i,'Les deux paniers sont pris');G.fry[k]=0;p.h=null;return feedback(i,'squirt')}
    if(!h){let k=-1,bt=-1;G.fry.forEach((c,j)=>{if(c>=FRY_T1&&c>bt){bt=c;k=j}});
      if(k<0)return say(i,G.fry.some(c=>c>=0)?'Les frites cuisent encore…':'La friteuse est vide');
      p.h={t:G.fry[k]>=FRY_T2?'charred':'fries'};G.fry[k]=-1;return feedback(i,'pick')}
    return say(i,'Mettez des frites surgelées dans la friteuse')}
  if(kind==='cups'){if(!h){p.h={t:'cup'};return feedback(i,'pick')}if(h.t==='cup'){p.h=null;return feedback(i,'drop')}return say(i,'Vous avez déjà les mains prises')}
  if(kind==='soda'){
    if(h&&h.t==='cup'){const k=G.soda.indexOf(-1);if(k<0)return say(i,'Les deux becs sont pris');G.soda[k]=0;p.h=null;return feedback(i,'drop')}
    if(!h){const k=G.soda.findIndex(c=>c>=SODA_T);if(k<0)return say(i,G.soda.some(c=>c>=0)?'Ça se remplit…':'Posez d’abord un gobelet');p.h={t:'soda'};G.soda[k]=-1;return feedback(i,'pick')}
    return say(i,'Il faut un gobelet vide')}
  if(kind==='tray'){
    if(!h){if(!G.tray.length)return say(i,'Le plateau est vide');p.h=G.tray.pop();return feedback(i,'pick')}
    if(h.t==='burger'&&h.c[h.c.length-1]!=='top')return say(i,'Fermez le burger avec un pain avant de le servir');
    if(!['burger','fries','soda'].includes(h.t))return say(i,'Seuls burgers, frites et sodas vont sur le plateau');
    if(G.tray.length>=4)return say(i,'Le plateau est plein');G.tray.push(h);p.h=null;return feedback(i,'drop')}
  if(kind==='bell'){feedback(i,'bell');
    const waiting=G.cust.filter(c=>c.st==='wait').sort((a,b)=>a.id-b.id);
    if(!G.tray.length)return say(i,'Le plateau est vide');
    if(!waiting.length)return say(i,'Aucune commande en attente : prenez d’abord la commande à la caisse');
    const c=waiting.find(c=>trayMatch(G.tray,c));
    if(!c)return say(i,'Ça ne correspond pas : '+trayDiff(G.tray,waiting[0]).join(', '));
    const o=orderOf(c),tip=Math.round(c.pat/c.max*30)/10,gain=o.price+tip;
    G.money+=gain;G.served++;G.tray=[];c.st='pick';c.slot=-1;
    return say(i,tip>=2?'Client ravi, pourboire de '+euro(tip)+' !':'Commande n°'+c.id+' servie','+'+euro(gain))}
  if(kind==='trash'){if(!h)return;if(h.t==='sauce')return say(i,'Reposez la sauce sur son support');p.h=null;return feedback(i,'drop')}
  if(kind==='cust'){const c=G.cust.find(c=>c.id===+arg);if(!c)return;
    if(c.st==='order'){const used=G.cust.filter(o=>o.st==='wait').map(o=>o.slot);const s=WAITS.findIndex((_,j)=>!used.includes(j));
      c.st='wait';c.slot=s<0?0:s;c.max=c.pat=mode==='solo'?150:130;
      return say(i,'Commande n°'+c.id+' : '+RECIPES[c.r].n+(c.fr?' + frites':'')+(c.dr?' + soda':''),'','order')}
    if(c.st==='wait')return say(i,'Ce client attend sa commande n°'+c.id);
    if(c.st==='in')return say(i,'Ce client fait la queue')}
}

/* --- simulation (solo / hôte) --- */
function simulate(dt){
  G.time-=dt;
  G.grill=G.grill.map(c=>c<0?c:c+dt);G.fry=G.fry.map(c=>c<0?c:c+dt);G.soda=G.soda.map(c=>c<0||c>=SODA_T?c:c+dt);
  G.next-=dt;
  if(G.next<=0){if(G.cust.length<6&&G.time>25)newCustomer();G.next=(mode==='solo'?24:17)*(.75+Math.random()*.5)*(G.time<90?.8:1)}
  const queue=G.cust.filter(c=>c.st==='in'||c.st==='order').sort((a,b)=>a.id-b.id);
  queue.forEach((c,k)=>{let t=k===0?REG:{x:REG.x,z:REG.z+.85*k};if(k>3)t={x:DOOR.x-1,z:DOOR.z-.6};c.tx=t.x;c.tz=t.z;
    if(k===0&&c.st==='in'&&Math.hypot(c.x-REG.x,c.z-REG.z)<.08){c.st='order';c.max=c.pat=50;broadcast('Un client attend à la caisse','order')}});
  G.cust.forEach(c=>{
    if(c.st==='wait'){const w=WAITS[c.slot]||WAITS[0];c.tx=w.x;c.tz=w.z}
    if(c.st==='pick'){c.tx=PICK.x;c.tz=PICK.z;if(Math.hypot(c.x-PICK.x,c.z-PICK.z)<.08)c.st='out'}
    if(c.st==='out'||c.st==='angry'){c.tx=DOOR.x;c.tz=DOOR.z+.3}
    const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz),sp=1.25*dt;
    if(d>sp){c.x+=dx/d*sp;c.z+=dz/d*sp}else{c.x=c.tx;c.z=c.tz}
    if(c.st==='order'||c.st==='wait'){c.pat-=dt;if(c.pat<=0){c.st='angry';G.angry++;broadcast('Le client n°'+c.id+' est parti, furieux','bad')}}
  });
  G.cust=G.cust.filter(c=>!((c.st==='out'||c.st==='angry')&&Math.hypot(c.x-DOOR.x,c.z-DOOR.z-.3)<.1));
  if(G.time<=0){G.time=0;G.ph='end';endScreen()}
}

function hide(){document.getElementById('overlay').hidden=true;lobbyOpen=false;document.getElementById('pads').hidden=!touch;document.getElementById('look').hidden=!touch;updateHint()}
function resetScene(){Object.keys(custs).forEach(removeCust)}
function startSolo(){mode='solo';li=0;resetScene();G=freshWorld(1);ticketSig='';hide();setNet('')}
function startHost(){const g=G?G.g:0;mode='host';li=0;resetScene();G=freshWorld(2);G.g=g+1;G.players[1].on=!!remote;ticketSig='';const o=otherPeer();lastAct=o&&o.presence.act?o.presence.act.n:0;hide()}
function startGuest(w){mode='guest';li=1;resetScene();G=freshWorld(2);G.g=w.g;G.players[0].on=true;lastMsg=w.m?w.m[0]:0;ticketSig='';applyWorld(w);hide()}
function endScreen(){
  const goal=mode==='solo'?[40,90,150]:[60,130,210],st=goal.filter(g=>G.money>=g).length;
  let rec='';if(mode!=='guest'&&G.money>best){best=G.money;rec=' (record !)';try{localStorage.setItem('bb5_best',best)}catch(e){}}
  sfx(st?'serve':'bad');
  const html=`<h2>Fermeture du restaurant</h2><div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}">★</span>`).join('')}</div>
    <div class="recap"><span>Caisse</span><b>${euro(G.money)}${rec}</b><span>Clients servis</span><b>${G.served}</b><span>Clients partis furieux</span><b>${G.angry}</b><span>Étoiles à</span><b>${goal.map(g=>g+' €').join(' / ')}</b></div>`;
  if(mode==='solo')overlay(html,[['Rouvrir',startSolo,'a'],['Menu',menu,'c']]);
  else if(mode==='host')overlay(html,[['Rouvrir ensemble',startHost,'a'],['Quitter',leaveOnline,'c']]);
  else overlay(html+'<p class="note">L’hôte peut rouvrir le restaurant.</p>',[['Quitter',leaveOnline,'c']]);
}
function menu(){
  const on=!!ROOM;
  overlay(`<h1>Bouvi'Burger</h1>
    <p>Vous tenez le seul fast-food de Bouvines. Une journée de service dure 6 minutes.</p>
    <ol>
      <li>Allez au <b>comptoir</b> et prenez la commande du client qui attend avec un « ! ».</li>
      <li>Steak cru sur la <b>plancha</b>, frites surgelées dans la <b>friteuse</b>, gobelet sous la <b>machine à soda</b>.</li>
      <li>Sur une <b>planche</b> : pain, garnitures, sauces, puis pain du dessus. Le tableau au mur donne les recettes.</li>
      <li>Posez tout sur le <b>plateau</b> et appuyez sur la <b>sonnette</b>.</li>
    </ol>
    <div class="ctl">${touch?'Manette à gauche pour marcher, glissez à droite pour regarder. Visez un objet avec le point au centre de l’écran, puis touchez Action.':'Z Q S D pour marcher, souris pour regarder (cliquez dans le restaurant). Visez un objet avec le point central et cliquez, ou appuyez sur E.'}</div>
    ${best?`<p class="note">Record : ${euro(best)}</p>`:''}
    <p class="note" id="onlineNote">${on?'À deux : chacun sur son écran. L’un crée la partie, l’autre la rejoint avec le code.':'Le jeu à deux en ligne se charge…'}</p>`,
    [['Jouer seul',startSolo,'a'],['Créer une partie à 2',createOnline,'b',!on],['Rejoindre',joinMenu,'c',!on]]);
}
function code4(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('')}
async function createOnline(){leaveOnlineSilent();const code=code4();
  try{await openRoom(code,'host')}catch(e){return overlay('<h2>Connexion impossible</h2><p>Le jeu à deux n’a pas pu démarrer. Réessayez dans un instant.</p>',[['Retour',menu,'c']])}
  mode='host';G=null;lobby()}
function joinMenu(){
  overlay(`<h2>Rejoindre une partie</h2><p>Entrez le code à 4 lettres affiché chez l’autre joueur.</p><input id="codeIn" maxlength="4" autocomplete="off" placeholder="ABCD">`,
    [['Rejoindre',async()=>{const c=(document.getElementById('codeIn').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4)return toast('Le code fait 4 lettres');
      leaveOnlineSilent();try{await openRoom(c,'guest')}catch(e){return overlay('<h2>Connexion impossible</h2><p>Vérifiez le code et réessayez.</p>',[['Retour',joinMenu,'c']])}
      mode='guest';G=null;lobby();setTimeout(()=>{if(lobbyOpen&&!remote)lobby()},3500)},'b'],['Retour',menu,'c']],
    o=>{const i=o.querySelector('#codeIn');i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')o.querySelector('.btn.b').click()})});
}
function lobby(){const o=remote;
  if(NET.role==='host')overlay(`<h2>Partie à deux</h2><p>Donnez ce code à l’autre joueur :</p><div class="code">${NET.code}</div>
      <p>${o?'Le 2e joueur est là ! Ouvrez le restaurant.':'En attente du 2e joueur… Il ouvre ce même jeu sur son écran, puis « Rejoindre ».'}</p>
      <p class="note">Il lui faut un compte Claude, et vous devez lui avoir partagé le jeu (bouton Partager, avec le droit de participer).</p>`,
      [['Ouvrir le restaurant',startHost,'b',!o],['Annuler',leaveOnline,'c']]);
  else overlay(`<h2>Partie ${NET.code}</h2><p>${o?'Connecté ! En attente que l’hôte ouvre le restaurant…':'Personne n’a encore créé de partie avec ce code. Vérifiez-le avec l’autre joueur.'}</p>`,[['Quitter',leaveOnline,'c']]);
  lobbyOpen=true}

/* ===================== DÉMARRAGE ===================== */
function init3d(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(touch?1.5:2,devicePixelRatio||1));
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;MAXANI=renderer.capabilities.getMaxAnisotropy();
  stage.prepend(renderer.domElement);
  scene=new THREE.Scene();scene.background=new THREE.Color('#1a1a1a');
  ray=new THREE.Raycaster();ray.far=2.5;CENTER=new THREE.Vector2(0,0);tmpV=new THREE.Vector3();
  camera=new THREE.PerspectiveCamera(70,1.6,.05,60);scene.add(camera);hand=new THREE.Group();camera.add(hand);
  cRaw=new THREE.Color('#d8707a');cCook=new THREE.Color('#6a3a1f');cBurn=new THREE.Color('#17110e');cFry0=new THREE.Color('#f2e2b0');cFry1=new THREE.Color('#f0b93a');cFry2=new THREE.Color('#3a2a18');
  makeTextures();makeMats();makeFoodGeos();buildLights();buildRoom();buildKitchen();setupPointer();
  const rs=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?80:68;camera.updateProjectionMatrix()};rs();addEventListener('resize',rs);
  const l=document.getElementById('loading');if(l)l.remove();
}
if(ok3d){try{init3d()}catch(e){ok3d=false;console.error(e)}}
if(!ok3d){const l=document.getElementById('loading');if(l)l.textContent='La 3D ne peut pas s’afficher sur cet appareil.'}
menu();requestAnimationFrame(loop);
</script>
